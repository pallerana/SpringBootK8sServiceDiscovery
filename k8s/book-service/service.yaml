# ClusterIP is the default. metadata.name (book-service) is the DNS name used by
# client-service (see app.book-service.service-name). Kubernetes creates the DNS
# record automatically; no separate DNS manifest.
apiVersion: v1
kind: Service
metadata:
  name: book-service
  namespace: service-discovery-demo
  labels:
    app: book-service
spec:
  selector:
    app: book-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
