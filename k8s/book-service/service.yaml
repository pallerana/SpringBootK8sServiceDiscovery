apiVersion: v1
kind: Service
metadata:
  name: book-service
  namespace: service-discovery-demo
  labels:
    app: book-service
spec:
  selector:
    app: book-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
---
